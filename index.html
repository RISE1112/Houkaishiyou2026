<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルAI 恋愛会話シミュレーター</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; margin: 0; padding: 15px; color: #333; }
  .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  h2, h3 { margin-top: 0; font-size: 1.1rem; color: #1c1c1e; }
  label { font-size: 0.85rem; font-weight: bold; color: #666; display: block; margin-top: 10px; }
  select, input, button { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem; box-sizing: border-box; }
  button { background: #007aff; color: #fff; font-weight: bold; border: none; margin-top: 15px; }
  button:active { opacity: 0.8; }
  
  .api-guide-box { background: #f0f7ff; border: 1px solid #007aff; padding: 12px; border-radius: 10px; margin-top: 8px; font-size: 0.83rem; line-height: 1.5; color: #1c1c1e; }
  .api-guide-box ol { margin: 6px 0 8px 0; padding-left: 20px; }
  .api-guide-box li { margin-bottom: 4px; }
  .api-link-btn { display: inline-block; width: 100%; text-align: center; background: #34c759; color: #fff; font-weight: bold; padding: 10px; border-radius: 8px; text-decoration: none; margin-top: 6px; box-sizing: border-box; }
  
  #chat-box { height: 320px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .target { background: #e9e9eb; color: #000; align-self: flex-start; border-bottom-left-radius: 2px; }
  .user { background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
  
  .feedback { background: #fff9e6; border: 1px solid #ffe58f; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; line-height: 1.5; }
  .example-text { background: #fff; padding: 8px; border-radius: 6px; border: 1px dashed #ffd591; margin-top: 6px; color: #d46b08; font-weight: bold; }
</style>
</head>
<body>

<div class="card" id="setup-card">
  <h2>ターゲット＆システム設定</h2>
  
  <label>1. Google AI Studio API Key</label>
  <input type="password" id="api-key" placeholder="AIStudioで取得したキーを貼り付け">
  
  <div class="api-guide-box">
    <strong>🔑 APIキーの取得方法（完全無料）</strong>
    <ol>
      <li>下のボタンからGoogle AI Studioを開きます。</li>
      <li>Googleアカウントでログインします。</li>
      <li><strong>「Create API key」</strong>をタップします。</li>
      <li>表示された英数字のコードをコピーして上に貼り付けます。</li>
    </ol>
    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="api-link-btn">👉 Google AI Studioを開いてキーを取得</a>
  </div>

  <label>2. 相手の名前</label>
  <input type="text" id="target-name" placeholder="例: りょうか">

  <label>ジャンル</label>
  <select id="genre">
    <option>一般女性</option>
    <option>アイドル</option>
    <option>地下アイドル</option>
    <option>コンカフェ嬢</option>
  </select>

  <label>年齢</label>
  <select id="age">
    <option>15〜19歳</option>
    <option>20〜24歳</option>
    <option>25〜29歳</option>
    <option>30〜34歳</option>
  </select>

  <label>MBTI（任意）</label>
  <select id="mbti">
    <option value="">未選択</option>
    <option>ENFP (運動家)</option>
    <option>INFP (仲介者)</option>
    <option>INFJ (提唱者)</option>
    <option>INTJ (建築家)</option>
    <option>ESFP (エンターテイナー)</option>
    <option>ISFP (冒険家)</option>
    <option>ESTP (起業家)</option>
    <option>ISTP (巨匠)</option>
    <option>ENTP (討論者)</option>
    <option>INTP (論理学者)</option>
    <option>ESFJ (領事)</option>
    <option>ISFJ (擁護者)</option>
    <option>ESTJ (幹部)</option>
    <option>ISTJ (管理者)</option>
    <option>ENFJ (主人公)</option>
    <option>ENTJ (指揮官)</option>
  </select>

  <label>性格</label>
  <select id="personality">
    <option>ノリが良く質問魔・興味津々</option>
    <option>ツンデレ・実は興味津々</option>
    <option>明るい・甘えん坊でかまってちゃん</option>
    <option>サバサバ系だが質問は多め</option>
    <option>おとなしいが話を聞きたがる</option>
  </select>

  <label>雰囲気</label>
  <select id="atmosphere">
    <option>ギャル系（リアクション大きめ）</option>
    <option>清楚系（丁寧だが興味津々）</option>
    <option>地雷系・サブカル（執着心あり）</option>
    <option>大人っぽい・お姉さん系（質問上手）</option>
    <option>あざと可愛い・量産型</option>
  </select>

  <label>関係性</label>
  <select id="count">
    <option>初対面（1回目）</option>
    <option>2〜3回目（興味を持ち始めている）</option>
    <option>常連・仲良し（好意あり）</option>
  </select>

  <label>フィードバックの口調</label>
  <select id="fb-style">
    <option value="strict">厳しいスパルタコーチ</option>
    <option value="friendly">優しい女子友達</option>
    <option value="logical">論理的恋愛アドバイザー</option>
  </select>

  <button onclick="startChat()">AIと会話を開始する</button>
</div>

<div class="card" id="chat-card" style="display:none;">
  <h3 id="chat-title">チャット</h3>
  <div id="chat-box"></div>
  <div id="feedback-box" class="feedback" style="display:none;"></div>

  <div style="margin-top: 10px;">
    <input type="text" id="user-input" placeholder="メッセージを入力...">
    <button onclick="sendMessage()" id="send-btn">送信する</button>
  </div>
</div>

<script>
let state = {};
let chatHistory = [];

async function startChat() {
  const apiKey = document.getElementById('api-key').value.trim();
  if(!apiKey) { alert('APIキーを入力してください'); return; }

  state = {
    apiKey: apiKey,
    name: document.getElementById('target-name').value.trim() || "女の子",
    genre: document.getElementById('genre').value,
    age: document.getElementById('age').value,
    mbti: document.getElementById('mbti').value,
    personality: document.getElementById('personality').value,
    atmosphere: document.getElementById('atmosphere').value,
    count: document.getElementById('count').value,
    fbStyle: document.getElementById('fb-style').value
  };

  document.getElementById('setup-card').style.display = 'none';
  document.getElementById('chat-card').style.display = 'block';
  document.getElementById('chat-title').innerText = `${state.name} とのリアルAIチャット`;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.innerText = "通信中...";

  chatHistory = [
    {
      role: "user",
      parts: [{ text: "会話を開始してください。最初の挨拶をお願いします。" }]
    }
  ];

  const data = await callGeminiAPI();

  if (data && data.reply) {
    addMessage(data.reply, 'target');
    chatHistory.push({
      role: "model",
      parts: [{ text: JSON.stringify(data) }]
    });
  } else {
    addMessage(`やっほー！${state.name}だよ！今日は何お話しする〜？✨`, 'target');
  }

  btn.disabled = false;
  btn.innerText = "送信する";
}

function buildSystemPrompt() {
  return `あなたは恋愛シミュレーションのキャラクター「${state.name}」です。
ユーザー（男性）とのLINEやチャットのやり取りを行います。

【キャラクター設定】
- 名前: ${state.name}
- ジャンル: ${state.genre}
- 年齢: ${state.age}
- MBTI: ${state.mbti}
- 性格: ${state.personality}
- 雰囲気・口調: ${state.atmosphere}
- 関係性: ${state.count}

【最重要指示】
- ユーザーの発言に自然に応答し、1〜2文程度のリアリティのあるLINE風テキストを作成してください。
- ユーザーに強い興味を持っており、毎回会話の中で「ユーザーへの質問」を自然に1つ入れて会話を膨らませてください。
- 返信のたびに、ユーザーの直前の送信文に対する「評価（100点満点）」「フィードバック（${state.fbStyle}の口調）」「おすすめの送信例」を作成してください。

【出力形式】
必ず以下のJSON形式でのみ出力してください。他のテキストは含めないでください。
{
  "reply": "女の子としての返信メッセージ",
  "score": "85点",
  "advice": "ユーザーの直前メッセージに対するアドバイス",
  "bestExample": "こう送るともっと良かった送信例"
}`;
}

function addMessage(text, type) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.innerText = "送信中...";

  addMessage(text, 'user');
  input.value = '';

  chatHistory.push({
    role: "user",
    parts: [{ text: text }]
  });

  const data = await callGeminiAPI();

  if (data && data.reply) {
    addMessage(data.reply, 'target');
    
    chatHistory.push({
      role: "model",
      parts: [{ text: JSON.stringify(data) }]
    });

    const fbBox = document.getElementById('feedback-box');
    fbBox.style.display = 'block';
    fbBox.innerHTML = `
      <strong>【フィードバック】 評価：${data.score || "80点"}</strong><br>
      ${data.advice || "自然で良いメッセージです！"}<br>
      <div style="margin-top:6px;"><strong>おすすめの送信例：</strong></div>
      <div class="example-text">${data.bestExample || "「そうなんだ！詳しく教えて！」"}</div>
    `;
  } else {
    addMessage("ごめんね、電波が悪くてうまく届かなかったみたい！もう一回送ってもらえる？", 'target');
  }

  btn.disabled = false;
  btn.innerText = "送信する";
}

async function callGeminiAPI() {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`;
  
  const payload = {
    systemInstruction: {
      parts: [{ text: buildSystemPrompt() }]
    },
    contents: chatHistory,
    generationConfig: {
      responseMimeType: "application/json"
    }
  };

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      console.error("APIエラーレスポンス:", await res.text());
      return null;
    }

    const result = await res.json();
    const rawText = result.candidates[0].content.parts[0].text;
    return JSON.parse(rawText);
  } catch(e) {
    console.error("通信またはパースエラー:", e);
    return null;
  }
}
</script>

</body>
</html>
