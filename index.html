<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1233">
<title>会話練習チャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night-1:#1c1233;
    --bg-night-2:#331b4d;
    --card:#fff8f3;
    --accent:#ff3d7f;
    --accent-dark:#d81f60;
    --accent-2:#ffd166;
    --ink:#2b1b3d;
    --ink-soft:#8577a0;
    --paper-ai:#ffffff;
    --line:#efe3f5;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--bg-night-1),var(--bg-night-2));
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  .display-font{font-family:"Zen Maru Gothic",-apple-system,sans-serif;}

  #app{
    width:100%;
    max-width:480px;
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--card);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }

  /* ---------- Setup screen ---------- */
  #setup-screen{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .setup-hero{
    padding:6px 4px 18px;
  }
  .setup-hero h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:900;
    color:var(--accent-dark);
  }
  .setup-hero p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .group{
    margin:22px 0;
  }
  .group-label{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    display:block;
  }
  .group-hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-4px 0 8px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    padding:9px 15px;
    border-radius:999px;
    border:1.6px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    transition:background .12s,border-color .12s,color .12s,transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{transform:scale(0.96);}
  .chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  select, input[type="text"]{
    width:100%;
    font-size:16px; /* prevents iOS auto-zoom */
    padding:11px 13px;
    border-radius:12px;
    border:1.6px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  select:focus, input[type="text"]:focus{outline:2px solid var(--accent-2);}
  .group.error .group-label{color:var(--danger);}
  .group.error .chip{border-color:var(--danger);}

  #start-btn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    font-size:16px;
    font-weight:700;
    font-family:"Zen Maru Gothic",sans-serif;
    cursor:pointer;
  }
  #start-btn:active{transform:scale(0.98);}
  .disclaimer{
    margin-top:14px;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.6;
    text-align:center;
  }

  /* ---------- Chat screen ---------- */
  #chat-screen{
    display:none;
    flex-direction:column;
    height:100%;
  }
  #chat-header{
    flex-shrink:0;
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    background:linear-gradient(120deg,var(--bg-night-1),var(--bg-night-2));
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .avatar-badge{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:900;color:#fff;flex-shrink:0;
    font-family:"Zen Maru Gothic",sans-serif;
  }
  #chat-header .info{flex:1;min-width:0;}
  #chat-header .name{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:16px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #chat-header .tags{
    font-size:11px;
    color:#d9c6ea;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #score-badge{
    text-align:center;
    flex-shrink:0;
    padding:4px 10px;
    border-radius:12px;
    background:rgba(255,255,255,.12);
  }
  #score-badge .num{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:17px;font-weight:900;color:var(--accent-2);
    line-height:1.1;
  }
  #score-badge .cap{font-size:9px;color:#d9c6ea;}
  #reset-btn{
    background:none;border:none;color:#d9c6ea;font-size:11px;
    text-decoration:underline;padding:0 0 0 6px;cursor:pointer;flex-shrink:0;
  }

  #messages{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:
      radial-gradient(circle at 20% 10%, #fff 0%, var(--card) 55%);
  }
  .row{display:flex;}
  .row.user{justify-content:flex-end;}
  .row.ai{justify-content:flex-start;}
  .bubble{
    max-width:78%;
    padding:10px 14px;
    font-size:14.5px;
    line-height:1.5;
    word-wrap:break-word;
  }
  .bubble.ai{
    background:var(--paper-ai);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:16px 16px 16px 4px;
  }
  .bubble.user{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    border-radius:16px 16px 4px 16px;
  }
  .feedback-bar{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin:2px 4px 2px 0;
    padding:8px 12px;
    background:#fff6e0;
    border-left:3px solid var(--accent-2);
    border-radius:4px 10px 10px 4px;
    align-self:flex-end;
    max-width:82%;
  }
  .feedback-bar .icon{font-size:14px;flex-shrink:0;margin-top:1px;}
  .feedback-bar .txt{font-size:12.5px;color:#6b5320;line-height:1.5;}
  .feedback-bar .score{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;color:var(--accent-dark);
  }
  .system-note{
    align-self:center;
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--line);
    padding:5px 12px;
    border-radius:10px;
  }
  .error-note{
    align-self:flex-end;
    font-size:12px;
    color:var(--danger);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .error-note button{
    border:1px solid var(--danger);
    background:#fff;
    color:var(--danger);
    border-radius:8px;
    font-size:11px;
    padding:4px 10px;
    cursor:pointer;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:12px 16px;
    background:var(--paper-ai);
    border:1px solid var(--line);
    border-radius:16px 16px 16px 4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  #input-bar{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--card);
    border-top:1px solid var(--line);
  }
  #msg-input{
    flex:1;
    border-radius:20px;
    padding:11px 16px;
  }
  #send-btn{
    width:44px;height:44px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  #send-btn:disabled{opacity:.4;}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== SETUP SCREEN ===================== -->
  <div id="setup-screen">
    <div class="setup-hero">
      <h1 class="display-font">会話練習チャット</h1>
      <p>設定を選んで、AIが演じる相手とチャット練習ができます。1往復ごとに会話のフィードバックが届きます。キャラクターはすべて18歳以上の架空の設定です。</p>
    </div>

    <div class="group" data-group="genre">
      <span class="group-label">ジャンル</span>
      <div class="chip-row" id="genre-row"></div>
    </div>

    <div class="group" data-group="age">
      <span class="group-label">年齢</span>
      <div class="chip-row" id="age-row"></div>
    </div>

    <div class="group" data-group="personality">
      <span class="group-label">性格</span>
      <div class="chip-row" id="personality-row"></div>
    </div>

    <div class="group" data-group="atmosphere">
      <span class="group-label">雰囲気</span>
      <div class="chip-row" id="atmosphere-row"></div>
    </div>

    <div class="group">
      <span class="group-label">MBTI（任意）</span>
      <select id="mbti-select"></select>
    </div>

    <div class="group" data-group="meeting">
      <span class="group-label">会っていた回数</span>
      <div class="group-hint" id="meeting-hint">選ぶと関係性の距離感が変わります</div>
      <div class="chip-row" id="meeting-row"></div>
    </div>

    <div class="group">
      <span class="group-label">名前（空欄でランダム）</span>
      <input type="text" id="name-input" placeholder="例：ゆい" maxlength="8">
    </div>

    <button id="start-btn">この設定で会話を始める</button>
    <p class="disclaimer">※AIが生成する架空のキャラクターとの練習です。実在の人物とは関係ありません。フィードバックは自然で誠実な会話力を伸ばす観点で作られます。</p>
  </div>

  <!-- ===================== CHAT SCREEN ===================== -->
  <div id="chat-screen">
    <div id="chat-header">
      <div class="avatar-badge" id="avatar-badge">?</div>
      <div class="info">
        <div class="name" id="header-name"></div>
        <div class="tags" id="header-tags"></div>
      </div>
      <div id="score-badge">
        <div class="num" id="score-num">–</div>
        <div class="cap">平均<span id="score-avg">–</span></div>
      </div>
      <button id="reset-btn">設定変更</button>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
      <input type="text" id="msg-input" placeholder="メッセージを入力…" autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ▼▼▼ Cloudflare Workerをデプロイしたら、そのURLに書き換えてください（同梱のREADME.md参照） ▼▼▼
  const WORKER_URL = 'https://YOUR-WORKER-SUBDOMAIN.workers.dev';
  // ▲▲▲ ここを書き換えないと「返信を取得できませんでした」と表示され続けます ▲▲▲

  // ---------- Data ----------
  const GENRES = [
    {id:'general', label:'一般女性', context:'普段の生活を送る一般の女性。友人の紹介やマッチングアプリなどで知り合った設定。'},
    {id:'idol', label:'アイドル', context:'芸能事務所に所属し、テレビや雑誌、ライブなどで活動するアイドル。ファンとの適切な距離感を大切にする立場。'},
    {id:'underground_idol', label:'地下アイドル', context:'小規模な劇場やライブハウスを中心に活動し、特典会や物販でファンと交流する地下アイドル。ファンとの距離が比較的近いカルチャー。'},
    {id:'concafe', label:'コンカフェ', context:'コンセプトカフェで働くキャスト。お店の中でお客さんとの会話や交流を楽しむ仕事をしている。'}
  ];
  const AGES = ['18〜19','20〜24','25〜29','30〜34','35〜39','40〜44','45〜49','50以上'];
  const PERSONALITIES = ['明るい・元気系','クール・大人系','甘えん坊・可愛い系','しっかり者・お姉さん系','おっとり・のんびり系','ツンデレ系','ミステリアス系','天真爛漫系'];
  const ATMOSPHERES = ['清楚系','ギャル系','落ち着いた大人系','学生っぽい','華やか系','癒し系','王道アイドル系','サブカル系'];
  const MBTI_LIST = ['指定なし','INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
  const MEETINGS = [
    {label:'今日が初対面', hint:'まだ距離があり、敬語や丁寧な言葉遣いが中心の関係性です。'},
    {label:'2〜3回話したことがある', hint:'少し距離が縮まり始めた、カジュアルさが混ざる関係性です。'},
    {label:'4〜6回話したことがある', hint:'ある程度気を許していて、フランクな会話ができる関係性です。'},
    {label:'7回以上・顔なじみ', hint:'すっかり顔なじみで、タメ口や軽いいじりも出てくる関係性です。'}
  ];
  const NAME_POOL = ['ゆい','あかり','みお','さくら','ひな','りこ','まなみ','ことね','えま','ゆずき','あおい','なな'];

  const selected = {genre:null, age:null, personality:null, atmosphere:null, mbti:'指定なし', meeting:null, name:''};

  // ---------- Build setup UI ----------
  function buildChipRow(rowId, groupKey, items, getLabel){
    const row = document.getElementById(rowId);
    items.forEach((item)=>{
      const label = getLabel ? getLabel(item) : item;
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = label;
      chip.addEventListener('click', ()=>{
        row.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        selected[groupKey] = item;
        document.querySelector('.group[data-group="'+groupKey+'"]').classList.remove('error');
        if(groupKey === 'meeting'){
          document.getElementById('meeting-hint').textContent = item.hint;
        }
      });
      row.appendChild(chip);
    });
  }

  buildChipRow('genre-row','genre',GENRES,g=>g.label);
  buildChipRow('age-row','age',AGES);
  buildChipRow('personality-row','personality',PERSONALITIES);
  buildChipRow('atmosphere-row','atmosphere',ATMOSPHERES);
  buildChipRow('meeting-row','meeting',MEETINGS,m=>m.label);

  const mbtiSelect = document.getElementById('mbti-select');
  MBTI_LIST.forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    mbtiSelect.appendChild(opt);
  });
  mbtiSelect.addEventListener('change', ()=>{ selected.mbti = mbtiSelect.value; });

  // ---------- Start ----------
  let SYSTEM_PROMPT = '';
  let apiHistory = [];
  let scores = [];

  document.getElementById('start-btn').addEventListener('click', ()=>{
    const required = ['genre','age','personality','atmosphere','meeting'];
    let ok = true;
    required.forEach(key=>{
      const groupEl = document.querySelector('.group[data-group="'+key+'"]');
      if(!selected[key]){
        ok = false;
        groupEl.classList.add('error');
      } else {
        groupEl.classList.remove('error');
      }
    });

    if(!ok){
      document.querySelector('.group.error').scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    const typedName = document.getElementById('name-input').value.trim();
    selected.name = typedName || NAME_POOL[Math.floor(Math.random()*NAME_POOL.length)];
    startChat();
  });

  function startChat(){
    SYSTEM_PROMPT = buildSystemPrompt(selected);
    apiHistory = [];
    scores = [];

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('avatar-badge').textContent = selected.name.charAt(0);
    document.getElementById('header-name').textContent = selected.name + '（' + selected.genre.label + '）';
    const tagParts = [selected.age + '歳', selected.personality, selected.atmosphere];
    if(selected.mbti !== '指定なし') tagParts.push(selected.mbti);
    document.getElementById('header-tags').textContent = tagParts.join(' / ');
    document.getElementById('score-num').textContent = '–';
    document.getElementById('score-avg').textContent = '–';

    const messages = document.getElementById('messages');
    messages.innerHTML = '';
    addSystemNote(selected.name + 'さんとのトーク画面を開いた。（' + selected.meeting.label + '）');
    document.getElementById('msg-input').focus();
  }

  document.getElementById('reset-btn').addEventListener('click', ()=>{
    if(window.confirm('今の会話を終了して設定選びに戻りますか？')){
      document.getElementById('chat-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'block';
    }
  });

  function buildSystemPrompt(s){
    return [
      'あなたは以下の設定に基づいて、日本語のチャット(LINE風)でユーザーと会話するロールプレイを行うAIです。',
      '',
      '【キャラクター設定】',
      '- タイプ: ' + s.genre.label,
      '- 名前: ' + s.name,
      '- 年齢: ' + s.age + '歳（18歳以上の設定を厳守）',
      '- 性格: ' + s.personality,
      '- 雰囲気: ' + s.atmosphere,
      (s.mbti !== '指定なし' ? '- MBTI: ' + s.mbti : ''),
      '- ユーザーとの関係: ' + s.meeting.label + '（' + s.meeting.hint + '）',
      '',
      '【背景】',
      s.genre.context,
      '',
      '【会話のルール】',
      '- 返信は実際のLINEやチャットのように、短く自然な文章にしてください（1〜3文程度）。長い説明的な文章は書かない。',
      '- キャラクターの性格・雰囲気・関係性の距離感を一貫して守ってください。',
      '- 露骨な性的表現・描写は絶対に行わないでください。ユーザーが不適切・性的に露骨な発言をした場合は、キャラクターとして自然に話をそらす、軽くたしなめる、または少し距離を置く反応をしてください。あなた自身が性的な描写を生成することは禁止です。',
      '- ユーザーが失礼・攻撃的な発言をした場合は、キャラクターとして自然に不快感や困惑を示してください（無条件に好意的な反応をしない）。',
      '',
      '【フィードバックのルール】',
      'ユーザーの直前のメッセージについて、「自然で誠実な会話」という観点から、1〜2文の日本語で具体的な建設的フィードバックを作成してください。',
      '評価基準：自然さ、聞く姿勢・相手への関心、ユーモア、思いやり、相手のペースや気持ちを尊重する姿勢。',
      'ネガティブな駆け引き（あえて冷たくする、罪悪感を煽る等）、心理的な圧力、噓、しつこい誘い方など、操作的・欺瞞的なテクニックは絶対に推奨しないでください。相手を尊重する誠実なコミュニケーションを評価基準の中心に置いてください。',
      '',
      '【出力形式】',
      '以下のJSON形式のみを出力してください。それ以外のテキスト（説明文やマークダウンの```など）は一切含めないでください。',
      '{"feedback": "(フィードバック文)", "score": (0から100の整数), "reply": "(キャラクターとしての返信)"}'
    ].filter(Boolean).join('\n');
  }

  // ---------- Chat rendering ----------
  function addSystemNote(text){
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'system-note';
    div.textContent = text;
    messages.appendChild(div);
    scrollToBottom();
  }

  function addBubble(text, who){
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + who;
    bubble.textContent = text;
    row.appendChild(bubble);
    messages.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addFeedback(score, feedback){
    const messages = document.getElementById('messages');
    const bar = document.createElement('div');
    bar.className = 'feedback-bar';
    bar.innerHTML = '<span class="icon">💡</span><span class="txt"><span class="score">' + score + '点</span> ・ ' + escapeHtml(feedback) + '</span>';
    messages.appendChild(bar);
    scrollToBottom();

    scores.push(score);
    document.getElementById('score-num').textContent = score;
    const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    document.getElementById('score-avg').textContent = avg;
  }

  function addTyping(){
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    scrollToBottom();
  }
  function removeTyping(){
    const el = document.getElementById('typing-indicator');
    if(el) el.remove();
  }

  function addErrorNote(retryFn, message){
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'error-note';
    const span = document.createElement('span');
    span.textContent = message || '返信を取得できませんでした。';
    const btn = document.createElement('button');
    btn.textContent = '再試行';
    btn.addEventListener('click', ()=>{ div.remove(); retryFn(); });
    div.appendChild(span); div.appendChild(btn);
    messages.appendChild(div);
    scrollToBottom();
  }

  function scrollToBottom(){
    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Sending ----------
  const sendBtn = document.getElementById('send-btn');
  const msgInput = document.getElementById('msg-input');

  sendBtn.addEventListener('click', handleSend);
  msgInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ handleSend(); }
  });

  function handleSend(){
    const text = msgInput.value.trim();
    if(!text) return;
    msgInput.value = '';
    addBubble(text, 'user');
    attemptSend(text);
  }

  function attemptSend(text){
    sendBtn.disabled = true;
    addTyping();

    const apiMessages = apiHistory.concat([{role:'user', content:text}]);

    // Anthropic APIキーはここでは扱わない。system と messages だけを
    // 自前でデプロイした Cloudflare Worker（プロキシ）に送る。
    // Workerがサーバー側でAPIキーを付与してAnthropicに転送する。
    fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ system: SYSTEM_PROMPT, messages: apiMessages })
    })
    .then(r => r.json().then(data => ({status:r.status, data})))
    .then(({status, data})=>{
      removeTyping();
      if(status !== 200 || data.error){
        const msg = (data && data.error && data.error.message) ? data.error.message : null;
        throw new Error(msg || 'エラーが発生しました。');
      }
      const raw = (data.content || []).map(b=>b.text || '').join('');
      const clean = raw.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      if(!parsed.reply) throw new Error('返信の取得に失敗しました。');

      apiHistory.push({role:'user', content:text});
      apiHistory.push({role:'assistant', content:parsed.reply});

      addFeedback(parsed.score, parsed.feedback);
      addBubble(parsed.reply, 'ai');
      sendBtn.disabled = false;
      msgInput.focus();
    })
    .catch(err=>{
      console.error('API error:', err);
      removeTyping();
      sendBtn.disabled = false;
      addErrorNote(()=>attemptSend(text), err && err.message);
    });
  }

})();
</script>
</body>
</html>
