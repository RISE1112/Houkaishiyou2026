<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアル恋愛会話シミュレーター</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; margin: 0; padding: 15px; color: #333; }
  .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  h2, h3 { margin-top: 0; font-size: 1.1rem; color: #1c1c1e; }
  label { font-size: 0.85rem; font-weight: bold; color: #666; display: block; margin-top: 10px; }
  select, input, button { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem; box-sizing: border-box; }
  button { background: #007aff; color: #fff; font-weight: bold; border: none; margin-top: 15px; }
  button:active { opacity: 0.8; }
  #chat-box { height: 320px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .target { background: #e9e9eb; color: #000; align-self: flex-start; border-bottom-left-radius: 2px; }
  .user { background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
  .feedback { background: #fff9e6; border: 1px solid #ffe58f; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; line-height: 1.5; }
  .example-text { background: #fff; padding: 8px; border-radius: 6px; border: 1px dashed #ffd591; margin-top: 6px; color: #d46b08; font-weight: bold; }
</style>
</head>
<body>

<div class="card" id="setup-card">
  <h2>ターゲット設定</h2>
  
  <label>相手の名前</label>
  <input type="text" id="target-name" placeholder="例: りょうか（未入力なら『ちゃん』付け）">

  <label>ジャンル</label>
  <select id="genre">
    <option>一般女性</option>
    <option>アイドル</option>
    <option>地下アイドル</option>
    <option>コンカフェ嬢</option>
  </select>

  <label>年齢</label>
  <select id="age">
    <option>15〜19歳</option>
    <option>20〜24歳</option>
    <option>25〜29歳</option>
    <option>30〜34歳</option>
  </select>

  <label>MBTI（任意）</label>
  <select id="mbti">
    <option value="">未選択</option>
    <option>ENFP (運動家)</option>
    <option>INFP (仲介者)</option>
    <option>INFJ (提唱者)</option>
    <option>INTJ (建築家)</option>
    <option>ESFP (エンターテイナー)</option>
    <option>ISFP (冒険家)</option>
    <option>ESTP (起業家)</option>
    <option>ISTP (巨匠)</option>
    <option>ENTP (討論者)</option>
    <option>INTP (論理学者)</option>
    <option>ESFJ (領事)</option>
    <option>ISFJ (擁護者)</option>
    <option>ESTJ (幹部)</option>
    <option>ISTJ (管理者)</option>
    <option>ENFJ (主人公)</option>
    <option>ENTJ (指揮官)</option>
  </select>

  <label>性格（バリエーション大幅拡張）</label>
  <select id="personality">
    <option>ツンデレ・警戒心高め</option>
    <option>明るい・フレンドリー</option>
    <option>おとなしい・控えめ</option>
    <option>ノリが良い・かまってちゃん</option>
    <option>サバサバ・姉御肌</option>
    <option>甘えん坊・ド天然</option>
    <option>サディスティック・小悪魔</option>
    <option>クーデレ・クール</option>
  </select>

  <label>雰囲気（スタイル拡張）</label>
  <select id="atmosphere">
    <option>清楚系</option>
    <option>地雷系・サブカル</option>
    <option>ギャル系</option>
    <option>大人っぽい・お姉さん系</option>
    <option>量産型・あざと系</option>
    <option>サブカル病み系</option>
    <option>ボーイッシュ・スポーティ</option>
  </select>

  <label>会った回数・関係性</label>
  <select id="count">
    <option>初対面（1回目）</option>
    <option>2〜3回目（少し慣れてきた）</option>
    <option>4〜5回目（そこそこ親しい）</option>
    <option>常連・タメ口で話せる仲</option>
  </select>

  <label>フィードバックの雰囲気（口調）</label>
  <select id="fb-style">
    <option value="strict">厳しい恋愛コーチ（スパルタアドバイス）</option>
    <option value="friendly">優しい女友達（共感＆サポート）</option>
    <option value="logical">論理的なアドバイザー（データ・戦略重視）</option>
  </select>

  <button onclick="startChat()">会話をスタートする</button>
</div>

<div class="card" id="chat-card" style="display:none;">
  <h3 id="chat-title">チャット</h3>
  <div id="chat-box"></div>

  <div id="feedback-box" class="feedback" style="display:none;"></div>

  <div style="margin-top: 10px;">
    <input type="text" id="user-input" placeholder="メッセージを入力...">
    <button onclick="sendMessage()">送信する</button>
  </div>
</div>

<script>
let state = {};
let lastReply = ""; // 重複防止用

function startChat() {
  const nameInput = document.getElementById('target-name').value.trim();
  state = {
    name: nameInput || "女の子",
    genre: document.getElementById('genre').value,
    age: document.getElementById('age').value,
    mbti: document.getElementById('mbti').value,
    personality: document.getElementById('personality').value,
    atmosphere: document.getElementById('atmosphere').value,
    count: document.getElementById('count').value,
    fbStyle: document.getElementById('fb-style').value
  };

  document.getElementById('setup-card').style.display = 'none';
  document.getElementById('chat-card').style.display = 'block';
  document.getElementById('chat-title').innerText = `${state.name} との会話`;

  // 会話スタート時の初期メッセージ生成
  let initialMsg = "";
  if (state.genre.includes("コンカフェ")) {
    initialMsg = state.atmosphere.includes("地雷") ? 
      `あ、いらっしゃい〜🖤 今日もお給仕がんばってるよ、あいにきてくれてありがと…！` : 
      `おかえりなさい〜！✨ 今日も話せてめっちゃ嬉しい！何飲む〜？`;
  } else if (state.genre.includes("地下")) {
    initialMsg = `今日もお話しにきてくれてありがと〜！！💕 めっちゃ会いたかった！`;
  } else if (state.personality.includes("ツンデレ")) {
    initialMsg = `…何？別に待ってたわけじゃないけど笑`;
  } else if (state.atmosphere.includes("ギャル")) {
    initialMsg = `やっほ〜！今日マジで暑くない？笑 何してたんー？`;
  } else if (state.personality.includes("サバサバ")) {
    initialMsg = `おーお疲れ！急に連絡してどうしたん？笑`;
  } else {
    initialMsg = `やっほー！今日もお疲れ様〜！✨`;
  }

  addMessage(initialMsg, 'target');
}

function addMessage(text, type) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';

  setTimeout(() => {
    generateResponseAndFeedback(text);
  }, 500);
}

function generateResponseAndFeedback(userText) {
  let replyList = [];
  let score = 75;
  let advice = "";
  let bestExample = "";

  // 1. 口調・語尾・装飾のカスタマイズ
  let suffix = "";
  if (state.atmosphere.includes("ギャル")) suffix = "〜！笑";
  else if (state.atmosphere.includes("地雷")) suffix = "…🥺";
  else if (state.personality.includes("ツンデレ")) suffix = "だし…w";
  else if (state.personality.includes("甘えん坊")) suffix = "〜！💕";
  else if (state.personality.includes("サバサバ")) suffix = "笑";

  // 2. 返信バリエーション構築（短文／好意／質問／疑問／雑談など）
  if (userText.length <= 4) {
    score = 40;
    if (state.personality.includes("ツンデレ") || state.personality.includes("クール")) {
      replyList = ["…ん？それだけ？w", "雑かよ笑", "短すぎて草。もうちょっと話してよ"];
    } else if (state.atmosphere.includes("ギャル")) {
      replyList = ["え短っ！ww ウケるんだけど笑", "一言すぎ！もっと話そうよ〜！"];
    } else {
      replyList = ["ん…？どうしたの？笑", "反応うす！なに考えてるの〜？"];
    }
    advice = "返信が短すぎます。相手がツッコミやすくしたり、話題を広げられる一言を追加しましょう。";
    bestExample = `「そういえば${state.name}ちゃんって、最近ハマってることとかある？」`;
  }
  else if (userText.includes("好き") || userText.includes("可愛い") || userText.includes("会いたい")) {
    if (state.count.includes("初対面")) {
      score = 45;
      replyList = [
        "えっ急に何！？笑 ちょっとびっくりしたかも笑",
        "あ、ありがと…！でも急すぎてちょっと緊張する笑",
        "みんなにそういうこと言ってるんじゃないの〜？笑"
      ];
      advice = `${state.genre}の初対面で直接的なアプローチをすると少し警戒されます。まずは内面や雰囲気を褒めるのが吉。`;
      bestExample = `「${state.name}ちゃんの話しやすい雰囲気、すごく素敵だなって思った！」`;
    } else {
      score = 90;
      replyList = [
        `え〜照れるんだけど！！笑 ${state.name}もめっちゃ嬉しい💕`,
        "急に言われるとドキッとするじゃん…！笑 ありがとう笑",
        "ほんとに〜？w でもそう言ってもらえるの素直に嬉しい！"
      ];
      advice = "関係値に合った自然なアプローチができています！相手のテンションも上がっています。";
      bestExample = `「今度もっとゆっくり話したいから、近いうちご飯行こうよ！」`;
    }
  }
  else if (userText.includes("何") || userText.includes("気になって") || userText.includes("どう")) {
    score = 80;
    replyList = [
      "あ、話すと長くなるんだけど最近〇〇にハマっててさ！笑",
      "えっとね、この前友達と行ったカフェがめっちゃ美味しかった話！笑",
      "実は今度のお休みにどこ行こうか迷ってたんだよね〜！"
    ];
    advice = "相手の言葉を拾って自然に会話を掘り下げられています。GOODです！";
    bestExample = `「へえ！何系のカフェ？おすすめあったら教えてほしい！」`;
  }
  else if (userText.includes("どこ") || userText.includes("行こう") || userText.includes("ご飯")) {
    if (state.count.includes("初対面")) {
      score = 55;
      replyList = [
        "いいね！でもまだお互いよく知らないし、サクッとカフェとかからなら！笑",
        "行きたーい！何好きなん？美味しいとこ教えて！"
      ];
      advice = "初対面でのお誘いは、重くならない「サクッとカフェ」程度の提案が成功率高めです。";
      bestExample = `「いいね！来週の昼間とか、サクッと美味しいお茶でもしに行かない？」`;
    } else {
      score = 88;
      replyList = [
        "行きたい！✨ ちょうど美味しいお肉食べたいと思ってた笑",
        "やった〜！いつ空いてる？予定合わせようよ！",
        "いいね！じゃあ美味しいお店リサーチしとくね笑"
      ];
      advice = "関係性ができているためスムーズに誘えています。日程調整まで一気に進めましょう！";
      bestExample = `「じゃあ来週の金曜か土曜あたりどう？都合いい方教えて！」`;
    }
  }
  else {
    score = 75;
    replyList = [
      `それめっちゃわかる！w てか今日こんなことあってさ〜聞いてよ！${suffix}`,
      `あはは、確かにね！笑 てか${state.name}も最近それ気になってた！`,
      `マジで？w ウケるんだけど。今度詳しく話してよ〜！`
    ];
    advice = "自然で友達感のある返信です。相手が話しやすいように最後を軽い質問で締めるとさらに良くなります。";
    bestExample = `「それめっちゃわかるw ちなみに${state.name}ちゃんはどっち派？」`;
  }

  // 3. ランダム抽出＆前回と重ならない返信を選択
  let selectedReply = replyList[Math.floor(Math.random() * replyList.length)];
  if (selectedReply === lastReply && replyList.length > 1) {
    selectedReply = replyList[(replyList.indexOf(selectedReply) + 1) % replyList.length];
  }
  lastReply = selectedReply;

  // MBTIアドバイス補足
  if (state.mbti) {
    advice += `\n💡【${state.mbti}攻略メモ】: ノリを合わせつつ、相手の興味関心に寄り添った言葉選びが効果的です。`;
  }

  addMessage(selectedReply, 'target');

  // フィードバックトーンの切替
  let fbHeader = "";
  if (state.fbStyle === 'strict') {
    fbHeader = `🔥【スパルタコーチ】 評価：${score}点`;
    advice = "【厳しく指導！】 " + advice;
  } else if (state.fbStyle === 'friendly') {
    fbHeader = `🌸【女子目線アドバイス】 評価：${score}点`;
    advice = "【ここ意識して〜】 " + advice;
  } else {
    fbHeader = `📊【会話データ分析】 評価：${score}点`;
    advice = "【要点分析】 " + advice;
  }

  // フィードバック表示
  const fbBox = document.getElementById('feedback-box');
  fbBox.style.display = 'block';
  fbBox.innerHTML = `
    <strong>${fbHeader}</strong><br>
    ${advice}<br>
    <div style="margin-top:8px;"><strong>おすすめの送信例：</strong></div>
    <div class="example-text">${bestExample}</div>
  `;
}
</script>

</body>
</html>
