<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1233">
<title>会話練習チャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night-1:#1c1233;
    --bg-night-2:#331b4d;
    --card:#fff8f3;
    --accent:#ff3d7f;
    --accent-dark:#d81f60;
    --accent-2:#ffd166;
    --ink:#2b1b3d;
    --ink-soft:#8577a0;
    --paper-ai:#ffffff;
    --line:#efe3f5;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--bg-night-1),var(--bg-night-2));
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  .display-font{font-family:"Zen Maru Gothic",-apple-system,sans-serif;}

  #app{
    width:100%;
    max-width:480px;
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--card);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }

  /* ---------- Setup screen ---------- */
  #setup-screen{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .setup-hero{
    padding:6px 4px 18px;
  }
  .setup-hero h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:900;
    color:var(--accent-dark);
  }
  .setup-hero p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .group{
    margin:22px 0;
  }
  .group-label{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    display:block;
  }
  .group-hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-4px 0 8px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    padding:9px 15px;
    border-radius:999px;
    border:1.6px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    transition:background .12s,border-color .12s,color .12s,transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{transform:scale(0.96);}
  .chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  select, input[type="text"]{
    width:100%;
    font-size:16px; /* prevents iOS auto-zoom */
    padding:11px 13px;
    border-radius:12px;
    border:1.6px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  select:focus, input[type="text"]:focus{outline:2px solid var(--accent-2);}
  .group.error .group-label{color:var(--danger);}
  .group.error .chip{border-color:var(--danger);}

  #start-btn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    font-size:16px;
    font-weight:700;
    font-family:"Zen Maru Gothic",sans-serif;
    cursor:pointer;
  }
  #start-btn:active{transform:scale(0.98);}
  .disclaimer{
    margin-top:14px;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.6;
    text-align:center;
  }

  /* ---------- Chat screen ---------- */
  #chat-screen{
    display:none;
    flex-direction:column;
    height:100%;
  }
  #chat-header{
    flex-shrink:0;
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    background:linear-gradient(120deg,var(--bg-night-1),var(--bg-night-2));
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .avatar-badge{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;
    font-size
